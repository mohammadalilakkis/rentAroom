# Server Configuration
server.port=8080

# Show exception on error page (for debugging 500s)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Log exceptions when they occur (so docker compose logs shows the 500 cause)
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=DEBUG
logging.level.com.rentaroom=DEBUG

# Database Configuration
# Default: local dev - MySQL in Docker on port 3307, use rentaroom user
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/rent_a_room?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rentaroom}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rentaroom}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session Configuration
server.servlet.session.timeout=30m

# Stripe Configuration
# Get your API keys from https://dashboard.stripe.com/apikeys
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.public.key=${STRIPE_PUBLIC_KEY:}
stripe.currency=${STRIPE_CURRENCY:usd}