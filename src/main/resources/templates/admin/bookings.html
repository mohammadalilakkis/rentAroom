<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Bookings - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div class="container">
            <div class="admin-header">
                <h1>Booking Management</h1>
            </div>
            
            <nav class="admin-nav">
                <a th:href="@{/admin/dashboard}" class="admin-nav-link">Dashboard</a>
                <a th:href="@{/admin/users}" class="admin-nav-link">Users</a>
                <a th:href="@{/admin/rooms}" class="admin-nav-link">Rooms</a>
                <a th:href="@{/admin/bookings}" class="admin-nav-link active">Bookings</a>
                <a th:href="@{/admin/payments}" class="admin-nav-link">Payments</a>
            </nav>
            
            <div th:if="${param.message}" class="alert alert-success">
                <span th:text="${param.message}"></span>
            </div>
            
            <section class="admin-section">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Room</th>
                                <th>Renter</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Total Price</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="booking : ${bookings}">
                                <td th:text="${booking.id}">1</td>
                                <td>
                                    <a th:href="@{/rooms/{id}(id=${booking.room.id})}" th:text="${booking.room.title}">Room Title</a>
                                </td>
                                <td th:text="${booking.renter.name}">Renter Name</td>
                                <td th:text="${#temporals.format(booking.checkIn, 'MMM dd, yyyy')}">Date</td>
                                <td th:text="${#temporals.format(booking.checkOut, 'MMM dd, yyyy')}">Date</td>
                                <td>$<span th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 2)}">0.00</span></td>
                                <td>
                                    <span class="status-badge" th:classappend="'status-' + ${booking.status.name().toLowerCase()}" 
                                          th:text="${booking.status.name()}">PENDING</span>
                                </td>
                                <td th:text="${#temporals.format(booking.createdAt, 'MMM dd, yyyy')}">Date</td>
                                <td>
                                    <div class="admin-actions">
                                        <a th:if="${booking.status.name() == 'PENDING'}" 
                                           th:href="@{/admin/bookings/confirm/{id}(id=${booking.id})}" 
                                           class="btn-primary btn-sm">Confirm</a>
                                        <a th:if="${booking.status.name() != 'CANCELLED'}" 
                                           th:href="@{/admin/bookings/cancel/{id}(id=${booking.id})}" 
                                           class="btn-danger btn-sm"
                                           onclick="return confirm('Are you sure you want to cancel this booking?')">Cancel</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
