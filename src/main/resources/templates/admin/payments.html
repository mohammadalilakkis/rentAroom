<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Payments - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div class="container">
            <div class="admin-header">
                <h1>Payment Management</h1>
            </div>
            
            <nav class="admin-nav">
                <a th:href="@{/admin/dashboard}" class="admin-nav-link">Dashboard</a>
                <a th:href="@{/admin/users}" class="admin-nav-link">Users</a>
                <a th:href="@{/admin/rooms}" class="admin-nav-link">Rooms</a>
                <a th:href="@{/admin/bookings}" class="admin-nav-link">Bookings</a>
                <a th:href="@{/admin/payments}" class="admin-nav-link active">Payments</a>
            </nav>
            
            <section class="admin-section">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Booking ID</th>
                                <th>Amount</th>
                                <th>Payment Method</th>
                                <th>Status</th>
                                <th>Paid At</th>
                                <th>Stripe Intent ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="payment : ${payments}">
                                <td th:text="${payment.id}">1</td>
                                <td th:text="${payment.booking.id}">1</td>
                                <td>$<span th:text="${#numbers.formatDecimal(payment.amount, 0, 2)}">0.00</span></td>
                                <td th:text="${payment.paymentMethod ?: 'N/A'}">N/A</td>
                                <td>
                                    <span class="status-badge" th:classappend="'status-' + ${payment.status.name().toLowerCase()}" 
                                          th:text="${payment.status.name()}">PENDING</span>
                                </td>
                                <td th:text="${payment.paidAt != null ? #temporals.format(payment.paidAt, 'MMM dd, yyyy HH:mm') : 'N/A'}">N/A</td>
                                <td th:text="${payment.stripePaymentIntentId ?: 'N/A'}">N/A</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
