<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div class="container">
            <div class="admin-header">
                <h1>Room Management</h1>
            </div>
            
            <nav class="admin-nav">
                <a th:href="@{/admin/dashboard}" class="admin-nav-link">Dashboard</a>
                <a th:href="@{/admin/users}" class="admin-nav-link">Users</a>
                <a th:href="@{/admin/rooms}" class="admin-nav-link active">Rooms</a>
                <a th:href="@{/admin/bookings}" class="admin-nav-link">Bookings</a>
                <a th:href="@{/admin/payments}" class="admin-nav-link">Payments</a>
            </nav>
            
            <div th:if="${param.message}" class="alert alert-success">
                <span th:text="${param.message}"></span>
            </div>
            
            <section class="admin-section">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Host</th>
                                <th>Location</th>
                                <th>Price</th>
                                <th>Capacity</th>
                                <th>Beds</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="room : ${rooms}">
                                <td th:text="${room.id}">1</td>
                                <td>
                                    <a th:href="@{/rooms/{id}(id=${room.id})}" th:text="${room.title}">Room Title</a>
                                </td>
                                <td th:text="${room.host.name}">Host Name</td>
                                <td th:text="${room.location}">Location</td>
                                <td>$<span th:text="${#numbers.formatDecimal(room.price, 0, 2)}">0.00</span>/night</td>
                                <td th:text="${room.capacity}">2</td>
                                <td th:text="${room.bedsAvailable ?: room.capacity}">2</td>
                                <td>
                                    <a th:href="@{/admin/rooms/delete/{id}(id=${room.id})}" 
                                       class="btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this room?')">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
