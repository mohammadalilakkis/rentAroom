<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div class="container">
            <div class="admin-header">
                <h1>User Management</h1>
            </div>
            
            <nav class="admin-nav">
                <a th:href="@{/admin/dashboard}" class="admin-nav-link">Dashboard</a>
                <a th:href="@{/admin/users}" class="admin-nav-link active">Users</a>
                <a th:href="@{/admin/rooms}" class="admin-nav-link">Rooms</a>
                <a th:href="@{/admin/bookings}" class="admin-nav-link">Bookings</a>
                <a th:href="@{/admin/payments}" class="admin-nav-link">Payments</a>
            </nav>
            
            <div th:if="${error}" class="alert alert-error">
                <span th:text="${error}"></span>
            </div>
            <div th:if="${param.message}" class="alert alert-success">
                <span th:text="${param.message}"></span>
            </div>
            
            <section class="admin-section">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}">1</td>
                                <td th:text="${user.name}">User Name</td>
                                <td th:text="${user.email}">user@example.com</td>
                                <td th:text="${user.phone ?: 'N/A'}">N/A</td>
                                <td>
                                    <span class="role-badge" th:text="${user.role.name()}">ROLE</span>
                                </td>
                                <td th:text="${#temporals.format(user.createdAt, 'MMM dd, yyyy')}">Date</td>
                                <td>
                                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" 
                                       class="btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this user?')">Delete</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
