<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent A Room - Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>
        
        <div>
        <section class="hero">
            <div class="container">
                <h1>Find Your Perfect Room or Bed</h1>
                <p>Rent rooms in houses, dorms, or even individual beds. Your next home is just a click away.</p>
            </div>
        </section>
        
        <section class="search-section">
            <div class="container">
                <form th:action="@{/}" method="get" class="search-form">
                    <div class="search-input-group">
                        <div class="search-input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <input type="text" name="location" id="location" placeholder="Enter location..." th:value="${location}" aria-label="Search by location">
                        </div>
                        <div class="search-input-wrapper">
                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="1" x2="12" y2="23"></line>
                                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                            </svg>
                            <input type="number" name="maxPrice" id="maxPrice" placeholder="Max price..." th:value="${maxPrice}" step="0.01" min="0" aria-label="Maximum price">
                        </div>
                        <button type="submit" class="btn-primary search-btn">
                            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <span>Search</span>
                        </button>
                    </div>
                </form>
            </div>
        </section>
        
        <section class="rooms-section">
            <div class="container">
                <h2>Available Rooms</h2>
                <div class="rooms-grid" th:if="${rooms != null && !rooms.isEmpty()}">
                    <div class="room-card" th:each="room : ${rooms}">
                        <div class="room-image">
                            <span class="placeholder-image">🏡</span>
                        </div>
                        <div class="room-content">
                            <h3><a th:href="@{/rooms/{id}(id=${room.id})}" th:text="${room.title}">Room Title</a></h3>
                            <p class="room-location">📍 <span th:text="${room.location}">Location</span></p>
                            <p class="room-description" th:text="${room.description}">Description</p>
                            <div class="room-meta">
                                <span class="room-capacity">👥 <span th:text="${room.capacity}">0</span> guests</span>
                                <span class="room-beds" th:if="${room.bedsAvailable != null}">
                                    🛏️ <span th:text="${room.bedsAvailable}">0</span> beds
                                </span>
                            </div>
                            <div class="room-footer">
                                <span class="room-price">$<span th:text="${#numbers.formatDecimal(room.price, 0, 2)}">0</span>/night</span>
                                <a th:href="@{/rooms/{id}(id=${room.id})}" class="btn-secondary">View Details</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="empty-state" th:if="${rooms == null || rooms.isEmpty()}">
                    <p>No rooms available at the moment. Check back later!</p>
                </div>
            </div>
        </section>
        </div>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
