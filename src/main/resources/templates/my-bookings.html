<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Rent A Room</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>
        
        <section class="bookings-section">
            <div class="container">
                <h1>My Bookings</h1>
                <div class="bookings-list" th:if="${bookings != null && !bookings.isEmpty()}">
                    <div class="booking-card" th:each="booking : ${bookings}">
                        <div class="booking-info">
                            <h3><a th:href="@{/rooms/{id}(id=${booking.room.id})}" th:text="${booking.room.title}">Room Title</a></h3>
                            <p>📍 <span th:text="${booking.room.location}">Location</span></p>
                            <p>Check-in: <span th:text="${#temporals.format(booking.checkIn, 'MMM dd, yyyy')}">Date</span></p>
                            <p>Check-out: <span th:text="${#temporals.format(booking.checkOut, 'MMM dd, yyyy')}">Date</span></p>
                            <p th:if="${booking.bedsBooked != null && booking.bedsBooked > 1}">
                                Beds: <span th:text="${booking.bedsBooked}">1</span>
                            </p>
                            <p class="booking-total">Total: $<span th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 2)}">0</span></p>
                            <p>Status: <span class="status-badge" th:classappend="'status-' + ${booking.status.name().toLowerCase()}" 
                               th:text="${booking.status.name()}">PENDING</span></p>
                        </div>
                        <div class="booking-actions" th:if="${booking.status.name() == 'PENDING'}">
                            <a th:href="@{/bookings/{id}(id=${booking.id})}" class="btn-secondary">View Details</a>
                            <a th:href="@{/bookings/cancel/{id}(id=${booking.id})}" class="btn-danger"
                               onclick="return confirm('Are you sure you want to cancel this booking?')">Cancel</a>
                        </div>
                    </div>
                </div>
                <div class="empty-state" th:if="${bookings == null || bookings.isEmpty()}">
                    <p>You don't have any bookings yet. <a th:href="@{/}">Start browsing rooms!</a></p>
                </div>
            </div>
        </section>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
