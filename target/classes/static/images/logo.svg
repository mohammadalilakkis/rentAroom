<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 50" width="180" height="50">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- House Icon -->
  <g transform="translate(5, 8)">
    <!-- House base -->
    <path d="M 10 25 L 25 15 L 40 25 L 40 35 L 10 35 Z" fill="url(#logoGradient)" stroke="none"/>
    <!-- Door -->
    <rect x="20" y="28" width="10" height="7" fill="#ffffff" opacity="0.9"/>
    <!-- Window left -->
    <rect x="13" y="20" width="6" height="6" fill="#ffffff" opacity="0.9" rx="1"/>
    <!-- Window right -->
    <rect x="31" y="20" width="6" height="6" fill="#ffffff" opacity="0.9" rx="1"/>
  </g>
  
  <!-- Text -->
  <text x="50" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="url(#logoGradient)">
    Rent A Room
  </text>
</svg>
