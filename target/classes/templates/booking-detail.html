<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details - Rent A Room</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{layout :: navbar}"></div>
    
    <main class="main-content">
        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}"></span>
        </div>
        <div th:if="${message}" class="alert alert-success">
            <span th:text="${message}"></span>
        </div>
        
        <section class="booking-detail-section">
            <div class="container">
                <div class="booking-detail-card" th:if="${booking}">
                    <h1>Booking Confirmed!</h1>
                    <div class="booking-detail-info">
                        <h2 th:text="${booking.room.title}">Room Title</h2>
                        <p><strong>Location:</strong> <span th:text="${booking.room.location}">Location</span></p>
                        <p><strong>Check-in:</strong> <span th:text="${#temporals.format(booking.checkIn, 'MMM dd, yyyy')}">Date</span></p>
                        <p><strong>Check-out:</strong> <span th:text="${#temporals.format(booking.checkOut, 'MMM dd, yyyy')}">Date</span></p>
                        <p th:if="${booking.bedsBooked != null && booking.bedsBooked > 1}">
                            <strong>Beds Booked:</strong> <span th:text="${booking.bedsBooked}">1</span>
                        </p>
                        <p><strong>Total Price:</strong> $<span th:text="${#numbers.formatDecimal(booking.totalPrice, 0, 2)}">0</span></p>
                        <p><strong>Status:</strong> <span class="status-badge" th:classappend="'status-' + ${booking.status.name().toLowerCase()}" 
                           th:text="${booking.status.name()}">PENDING</span></p>
                    </div>
                    <div class="booking-actions">
                        <a th:href="@{/}" class="btn-primary">Browse More Rooms</a>
                        <a th:href="@{/bookings/my-bookings}" class="btn-secondary">View All Bookings</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <div th:replace="~{layout :: footer}"></div>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
