<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Rent A Room'">Rent A Room</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar" th:fragment="navbar">
        <div class="container">
            <div class="nav-brand">
                <a th:href="@{/}">🏠 Rent A Room</a>
            </div>
            <ul class="nav-menu">
                <li><a th:href="@{/}">Browse Rooms</a></li>
                <li th:if="${user == null}"><a th:href="@{/login}">Login</a></li>
                <li th:if="${user == null}"><a th:href="@{/register}" class="btn-primary">Sign Up</a></li>
                <li th:if="${user != null && user.role.name() == 'HOST'}"><a th:href="@{/rooms/create}">List Room</a></li>
                <li th:if="${user != null}"><a th:href="@{/dashboard}">Dashboard</a></li>
                <li th:if="${user != null}"><a th:href="@{/bookings/my-bookings}">My Bookings</a></li>
                <li th:if="${user != null}">
                    <span class="user-info">
                        <span th:text="${user.name}">User</span> 
                        <a th:href="@{/logout}" class="logout-link">Logout</a>
                    </span>
                </li>
            </ul>
        </div>
    </nav>
    
    <footer class="footer" th:fragment="footer">
        <div class="container">
            <p>&copy; 2025 Rent A Room. All rights reserved.</p>
        </div>
    </footer>
</html>
